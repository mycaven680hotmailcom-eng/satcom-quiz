[150,"Which statement is true regarding the Earth Verification Test?","All the above are true regarding Earth Verification Test",["The purpose of Earth Verification Test is to verify the optimal antenna pointing prior to the actual transmission","The purpose of Earth Verification Test is to manually analyse the spectrum of the test carrier","The purpose of Earth Verification Test is to ensure that transmission can be received at maximum power by the satellite transponder and does not interfere with other transmission on the opposite polarization"],2]
];
let Q,done,first,att,streak,cur,wrongOnce;
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function start(){Q=sh(D.map((_,i)=>i));done=0;first=0;att=0;streak=0;wrongOnce=new Set();next()}
function hud(){$("sc").textContent=first;$("at").textContent=att;$("ms").textContent=done+"/"+D.length;$("sk").textContent=streak;$("pb").style.width=done/D.length*100+"%"}
function opts(d){
 if(d[4]===1)return [[d[3][0],0],[d[3][1],0],[d[3][2],0],[d[2],1]];
 if(d[4]===2)return [[d[3][0],0],[d[2],1],[d[3][1],0],[d[3][2],0]];
 return sh([[d[2],1],...d[3].map(x=>[x,0])]);
}
function next(){
 hud();
 if(!Q.length){$("box").innerHTML='<div class="big">🎉 '+first+' / '+D.length+'</div><p style="text-align:center">All questions mastered!<br>First-try correct: '+first+' · Total attempts: '+att+'</p><p style="text-align:center"><button class="btn" id="rs">Restart</button></p>';$("rs").onclick=start;return}
 cur=Q.shift();const d=D[cur],L="ABCD",o=opts(d);
 $("box").innerHTML='<div class="qn">Question '+d[0]+(wrongOnce.has(cur)?" · retry":"")+'</div><h2></h2><div id="os"></div><div class="fb" id="fb"></div><div id="nx"></div>';
 $("box").querySelector("h2").textContent=d[1];
 o.forEach((x,i)=>{const b=document.createElement("button");b.className="o";b.textContent=L[i]+") "+x[0];b.onclick=()=>pick(b,x[1],o,d);b.dataset.c=x[1];$("os").appendChild(b)});
}
function pick(b,ok,o,d){
 att++;const bs=[...document.querySelectorAll(".o")];bs.forEach(x=>x.disabled=true);
 const fb=$("fb");
 if(ok){b.classList.add("ok");fb.style.color="var(--ok)";fb.textContent="✓ Correct!";streak++;done++;if(!wrongOnce.has(cur))first++}
 else{b.classList.add("no");bs.find(x=>x.dataset.c==="1").classList.add("ok");fb.style.color="var(--no)";fb.textContent="✗ Not quite — this one will come back.";streak=0;wrongOnce.add(cur);Q.splice(Math.min(Q.length,3+(Math.random()*3|0)),0,cur)}
 hud();const n=document.createElement("button");n.className="btn";n.textContent=Q.length?"Next":"Finish";n.onclick=next;$("nx").appendChild(n);
}
start();
</script></body></html>
